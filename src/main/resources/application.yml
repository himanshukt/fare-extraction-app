server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: gemini-3.1-flash-lite
            temperature: 0.0
  application:
    name: fare-extraction

fare:
  extraction:
    high-confidence-threshold: 0.90
    medium-confidence-threshold: 0.70
    max-ai-retries: 1
    max-pdf-pages: 5
    image-render-dpi: 72
    supported-mime-types:
      - application/pdf
      - image/jpeg
      - image/png

logging:
  level:
    com.example.fare: DEBUG
    org.springframework.ai: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
